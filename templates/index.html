<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird - Multiplayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="static/style.css">



    <link rel="stylesheet" href="{{ url_for('static', filename='flappybird.css') }}">
    <style>
        body {
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #333;
            color: white;
        }

        canvas {
            border: 2px solid white;
            display: block;
            margin: 20px auto;
        }

        .cursor-position {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 1000;
            color: black;
        }

        .user-cursor {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
        }

        .cursor-label {
            position: absolute;
            top: -20px;
            left: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 10px;
            white-space: nowrap;
        }

        .game-container {
            text-align: center;
        }
        .start-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 2000;
        }
        .start-screen.hidden { display: none; }

        .chat-area {
            border: 1px solid white;
            padding: 10px;
            width: 360px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="cursor-position">
        <div id="myPosition">Your cursor: (0, 0)</div>
    </div>
    <div id="startScreen" class="start-screen">
    <h1>Flappy Bird Multiplayer</h1>
    <p>Press Start to play!</p>
    <button onclick="startGame()">Start</button>
    </div>


    <div class="game-container">


    <div class="game-container" style="float:left;">
        <h1>Flappy Bird - Multiplayer</h1>
        <p>Press SPACE, ARROW UP, or X to jump</p>
        <canvas id="board"></canvas>
    </div>

    <div class="chat-area">
        <div id="messages"></div>
        <input id="msg" type="text" placeholder="Enter your message">
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="audio_play">
    <audio src="static/bgm_mario.mp3" autoplay loop></audio>
    </div>
    <script src="{{ url_for('static', filename='logic.js') }}"></script>
    <script src="{{ url_for('static', filename='flappybird.js') }}"></script>
</body>

</html>
