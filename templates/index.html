<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird - Multiplayer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='flappybird.css') }}">
</head>
<body>
    <div class="cursor-position">
        <div id="myPosition">Your cursor: (0, 0)</div>
    </div>

    <div id="startScreen" class="start-screen">
        <h1>Flappy Bird Multiplayer</h1>
        <p>Press Start to play!</p>
        <button onclick="startGame()">Start</button>
    </div>

    <div class="main-container">
        <div class="grid-spacer"></div>
        <div class="game-container">
            <h1>Flappy Bird - Multiplayer</h1>
            <p>Press SPACE, ARROW UP, or X to jump</p>
            <canvas id="board"></canvas>
        </div>

        <div class="chat-area">
            <div id="messages"></div>
            <div class="chat-input-row">
                <input id="msg" type="text" placeholder="Enter your message">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <audio src="{{ url_for('static', filename='bgm_mario.mp3') }}" loop></audio>

    <script src="{{ url_for('static', filename='logic.js') }}"></script>
    <script src="{{ url_for('static', filename='flappybird.js') }}"></script>
</body>
</html>
